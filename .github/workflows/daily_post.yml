name: Update daily image

on:
  schedule:
    # 毎日 09:30 JST（UTC 00:30）
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

          # ===== キャッシュ完全回避（index.html内の v= を毎日更新）=====
          export VERSION=$(date -u -d "+9 hours" +"%Y%m%d")

          python - <<'PY'
          import os, re
          from pathlib import Path

          version = os.environ["VERSION"]
          p = Path("index.html")
          html = p.read_text(encoding="utf-8")

          # result.jpg?v=数字 を 今日の日付に置換
          html2 = re.sub(r'(result\.jpg\?v=)\d+', r'\g<1>' + version, html)

          # もし v= が無い場合は付ける（保険）
          if html2 == html and "result.jpg" in html:
              html2 = html.replace("result.jpg", f"result.jpg?v={version}")

          p.write_text(html2, encoding="utf-8")
          print("index.html updated to v=", version)
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"

          git add result.jpg index.html bg_used.txt ai_raw.txt || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update daily image"
          git push
