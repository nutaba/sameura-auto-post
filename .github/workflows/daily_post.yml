name: Update daily image

on:
  schedule:
    # テスト用：1時間ごと（毎時00分）
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

          # テスト中は「分まで」入れて、毎回URLが変わるようにする（キャッシュ完全回避）
          VERSION=$(date -u -d "+9 hours" +"%Y%m%d%H%M")

          if grep -q "result.jpg?v=" index.html; then
            sed -i "s/result.jpg?v=[0-9]*/result.jpg?v=${VERSION}/" index.html
          else
            sed -i "s/result.jpg/result.jpg?v=${VERSION}/" index.html
          fi

      - name: Commit and push
        run: |
          git config user.name "actions-user"
          git config user.email "actions-user@users.noreply.github.com"

          git add result.jpg index.html || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update daily image"
          git push
