name: Update daily image

on:
  schedule:
    # 毎日 09:30 JST（UTC 00:30）
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

          # ==============================
          # キャッシュ完全回避
          # index.html の result.jpg?v=YYYYMMDD に日付を埋め込む
          # ==============================
          VERSION=$(date -u -d "+9 hours" +"%Y%m%d")

          # index.html が無い場合は自動生成（初回対策）
          if [ ! -f index.html ]; then
            cat > index.html << 'EOF'
            <!doctype html>
            <html lang="ja">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width,initial-scale=1" />
              <title>早明浦ダム 貯水率</title>
              <style>
                body {
                  margin: 0;
                  background: #000;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                }
                img {
                  width: 100%;
                  max-width: 1080px;
                  height: auto;
                }
              </style>
            </head>
            <body>
              <img src="result.jpg?v=__VERSION__" alt="早明浦ダム 貯水率" />
            </body>
            </html>
EOF
          fi

          # __VERSION__ を今日の日付に置換（毎日URLが変わる→キャッシュ回避）
          sed -i "s/__VERSION__/${VERSION}/g" index.html

      - name: Commit and push if changed
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"

          git add result.jpg index.html bg_used.txt ai_raw.txt || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update daily image"
          git push
