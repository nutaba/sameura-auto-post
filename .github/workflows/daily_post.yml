name: Update daily image

on:
  schedule:
    # 毎日 08:00 JST（UTC 23:00）
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

          VERSION=$(date -u -d "+9 hours" +"%Y%m%d")

          if grep -q "result.jpg?v=" index.html; then
            sed -i "s/result.jpg?v=[0-9]*/result.jpg?v=${VERSION}/" index.html
          else
            sed -i "s/result.jpg/result.jpg?v=${VERSION}/" index.html
          fi

      - name: Commit and push
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add result.jpg index.html || true
          git diff --cached --quiet || git commit -m "Update daily image"
          git push
